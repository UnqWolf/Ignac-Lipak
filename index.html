<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignác oldala</title>
    <!-- Firebase SDK betöltése -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- Google reCAPTCHA Script -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Times New Roman", Times, serif;
            margin: 40px;
            line-height: 1.6;
        }
        h1 {
            color: #0000cc;
            border-bottom: 1px solid #cccccc;
            padding-bottom: 5px;
        }
        /* Teljesen rejtett gomb a jobb alsó sarokban */
        .admin-btn {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1000;
        }
        .editable-active {
            outline: 2px dashed #ff3333;
            background-color: rgba(250, 0, 0, 0.05);
        }
        /* reCAPTCHA doboz stílusa */
        #recaptcha-container {
            position: fixed;
            bottom: 50px;
            right: 20px;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <!-- A főoldal tartalma -->
    <div id="szerkesztheto-tartalom">
        <h1 contenteditable="false" id="cim">Üdvözöllek a weboldalamon!</h1>
        <p contenteditable="false" id="szoveg">Szia! Én vagyok Ignác.</p>
    </div>

    <!-- Rejtett gomb a jobb alsó sarokban -->
    <button class="admin-btn" onclick="triggerAdmin()" title="Admin"></button>

    <!-- reCAPTCHA widget -->
    <div id="recaptcha-container"></div>

    <script>
        // 1. Firebase konfiguráció
        const firebaseConfig = {
            databaseURL: "https://vercel-custom-il-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const cimElem = document.getElementById('cim');
        const szovegElem = document.getElementById('szoveg');

        // 2. Adatok automatikus betöltése
        db.ref('oldalAdatok').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.cim) cimElem.innerText = data.cim;
                if (data.szoveg) szovegElem.innerText = data.szoveg;
            }
        });

        let adminModeOn = false;
        const HelyesJelszo = "ignac123"; // Itt a jelszavad

        function triggerAdmin() {
            if (!adminModeOn) {
                // Ha még nincs bent, először reCAPTCHA ellenőrzés
                grecaptcha.ready(function() {
                    grecaptcha.render('recaptcha-container', {
                        'sitekey': '6LccpIctAAAAAJ8-HO2hba1QTwODRYv5aSu48Ajq',
                        'callback': function(response) {
                            // Ha a reCAPTCHA sikeres volt, töröljük a widgetet és kérjük a jelszót
                            document.getElementById('recaptcha-container').innerHTML = '';
                            ellenorizJelszo();
                        }
                    });
                });
            } else {
                // Mentés, ha már szerkesztési módban van
                adminModeOn = false;
                cimElem.contentEditable = "false";
                szovegElem.contentEditable = "false";
                
                cimElem.classList.remove('editable-active');
                szovegElem.classList.remove('editable-active');

                db.ref('oldalAdatok').set({
                    cim: cimElem.innerText,
                    szoveg: szovegElem.innerText
                });
                alert("Módosítások elmentve az adatbázisba!");
            }
        }

        function ellenorizJelszo() {
            let jelszo = prompt("Add meg az admin jelszót:");
            if (jelszo === HelyesJelszo) {
                adminModeOn = true;
                cimElem.contentEditable = "true";
                szovegElem.contentEditable = "true";
                
                cimElem.classList.add('editable-active');
                szovegElem.classList.add('editable-active');
                alert("Admin mód bekapcsolva! Kattints újra a jobb alsó sarokba a mentéshez.");
            } else if (jelszo !== null) {
                alert("Hibás jelszó!");
            }
        }
    </script>

</body>
</html>
    </script>

</body>
</html>
