<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignác oldala</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js?onload=onloadCallback&render=explicit" async defer></script>
    <!-- SortableJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        #captcha-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        .bypass-btn {
            background: transparent;
            border: none;
            color: #777;
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
            margin-top: 20px;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Times New Roman", Times, serif;
            margin: 40px;
            line-height: 1.6;
        }

        #main-content { display: none; }
        h1, h2 { color: #0000cc; margin-top: 0; }
        img { max-width: 100%; height: auto; display: block; }
        
        .btn-link {
            display: inline-block;
            padding: 8px 16px;
            background: #0000cc;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        /* Normál nézetben rejtett elemek */
        .drag-handle { display: none; }
        .secret-admin-trigger {
            position: fixed; bottom: 0; right: 0;
            width: 40px; height: 40px;
            background: transparent; border: none;
            cursor: pointer; z-index: 1000;
        }

        /* Admin Eszköztár */
        #admin-toolbar {
            display: none;
            position: fixed; top: 15px; right: 15px;
            background: #111111; padding: 10px 15px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 2000; font-family: sans-serif;
            gap: 6px; align-items: center; flex-wrap: wrap;
        }

        #admin-toolbar button {
            background: #333; color: white; border: 1px solid #555;
            padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }

        #admin-toolbar button:hover { background: #555; }
        #admin-toolbar button.save-btn { background: #28a745; border-color: #28a745; font-weight: bold; }

        /* Admin Aktív Stílusok: Átméretezés + Fogantyú */
        .admin-active .drag-item {
            position: relative;
            outline: 2px dashed #007bff !important;
            background-color: rgba(0, 123, 255, 0.03);
            padding: 25px 10px 10px 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            /* ÁTMÉRETEZHETŐSÉG */
            resize: both;
            overflow: auto;
            min-height: 40px;
            min-width: 150px;
        }

        .admin-active .drag-handle {
            display: inline-block;
            position: absolute;
            top: 2px;
            left: 2px;
            background: #007bff;
            color: white;
            font-size: 10px;
            font-family: sans-serif;
            padding: 2px 6px;
            border-radius: 2px;
            cursor: grab;
            user-select: none;
            z-index: 10;
        }

        .admin-active .drag-handle:active {
            cursor: grabbing;
        }

        .sortable-ghost {
            opacity: 0.3;
            background: #cce5ff !important;
        }
    </style>
</head>
<body>

    <!-- reCAPTCHA Kapu -->
    <div id="captcha-overlay">
        <h2>Kérjük, igazold, hogy nem vagy robot!</h2>
        <div id="recaptcha-widget"></div>
        <button class="bypass-btn" onclick="bypassCaptcha()">Belépés jelszóval (bypass)</button>
    </div>

    <!-- Fő Weboldal Tartalom -->
    <div id="main-content">
        <div id="szerkesztheto-tartalom">
            <div class="drag-item">
                <span class="drag-handle">⋮⋮ Húzás</span>
                <h1 id="cim">Üdvözöllek a weboldalamon!</h1>
            </div>
            <div class="drag-item">
                <span class="drag-handle">⋮⋮ Húzás</span>
                <p id="szoveg">Szia! Én vagyok Ignác.</p>
            </div>
        </div>
    </div>

    <!-- Rejtett admin gomb -->
    <button class="secret-admin-trigger" onclick="loginAdmin()" title="Admin"></button>

    <!-- Admin Eszköztár -->
    <div id="admin-toolbar">
        <span style="color:#aaa; font-size:12px; margin-right:5px;">🛠️ Editor</span>
        <button onclick="addElement('h2')">+ Cím</button>
        <button onclick="addElement('p')">+ Szöveg</button>
        <button onclick="addImage()">+ Kép</button>
        <button onclick="addButton()">+ Gomb</button>
        <button onclick="changeBgColor()">Háttér</button>
        <button class="save-btn" onclick="saveAndExit()">💾 Mentés & Kilépés</button>
    </div>

    <script>
        // Firebase Konfiguráció
        const firebaseConfig = {
            databaseURL: "https://vercel-custom-il-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const contentArea = document.getElementById('szerkesztheto-tartalom');
        let adminModeOn = false;
        let sortableInstance = null;
        const HelyesJelszo = "ignac123";

        // reCAPTCHA
        function onloadCallback() {
            grecaptcha.render('recaptcha-widget', {
                'sitekey': '6LccpIctAAAAAJ8-HO2hba1QTwODRYv5aSu48Ajq',
                'callback': function(response) { unlockPage(); }
            });
        }

        function bypassCaptcha() {
            let jelszo = prompt("Add meg a bypass jelszót:");
            if (jelszo === HelyesJelszo) { unlockPage(); }
            else if (jelszo !== null) { alert("Hibás jelszó!"); }
        }

        function unlockPage() {
            document.getElementById('captcha-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        // Adatok betöltése
        db.ref('oldalAdatok').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.html) contentArea.innerHTML = data.html;
                if (data.bgColor) document.body.style.backgroundColor = data.bgColor;
            }
        });

        // Admin Bejelentkezés
        function loginAdmin() {
            if (adminModeOn) return;

            let jelszo = prompt("Add meg az admin jelszót:");
            if (jelszo === HelyesJelszo) {
                adminModeOn = true;
                document.body.classList.add('admin-active');
                document.getElementById('admin-toolbar').style.display = 'flex';
                
                enableEditingAndDrag();
                alert("Admin Mód Bekapcsolva!\n\n1. Mozgatás: Húzd a kék '⋮⋮ Húzás' gombot.\n2. Átméretezés: Húzd a doboz jobb alsó sarkát.\n3. Szerkesztés: Kattints a szövegbe.\n4. Törlés: Dupla kattintás az elemen.");
            } else if (jelszo !== null) {
                alert("Hibás jelszó!");
            }
        }

        function enableEditingAndDrag() {
            // SortableJS inicializálása kizárólag a fogantyúval (.drag-handle)
            sortableInstance = new Sortable(contentArea, {
                animation: 150,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                draggable: '.drag-item'
            });

            refreshItems();
        }

        function refreshItems() {
            const items = contentArea.querySelectorAll('.drag-item');
            items.forEach(item => {
                // Csak a belső elemeket tesszük szerkeszthetővé, a fogantyút nem
                const textElements = item.querySelectorAll('h1, h2, p, a');
                textElements.forEach(el => el.contentEditable = "true");

                item.ondblclick = function(e) {
                    if (adminModeOn && e.target.className !== 'drag-handle' && confirm("Törölni szeretnéd ezt az elemet?")) {
                        item.remove();
                    }
                };
            });
        }

        function addElement(tag) {
            const wrapper = document.createElement('div');
            wrapper.className = 'drag-item';
            wrapper.innerHTML = `<span class="drag-handle">⋮⋮ Húzás</span><${tag}>${tag === 'h2' ? 'Új alcím' : 'Új bekezdés szövege...'}</${tag}>`;
            
            contentArea.appendChild(wrapper);
            refreshItems();
        }

        function addImage() {
            let url = prompt("Add meg a kép URL címét:");
            if (url) {
                const wrapper = document.createElement('div');
                wrapper.className = 'drag-item';
                wrapper.innerHTML = `<span class="drag-handle">⋮⋮ Húzás</span><img src="${url}">`;
                
                contentArea.appendChild(wrapper);
                refreshItems();
            }
        }

        function addButton() {
            let text = prompt("Gomb szövege:", "Kattints ide");
            let link = prompt("Hova mutasson a gomb? (URL):", "https://");
            if (text && link) {
                const wrapper = document.createElement('div');
                wrapper.className = 'drag-item';
                wrapper.innerHTML = `<span class="drag-handle">⋮⋮ Húzás</span><a href="${link}" class="btn-link" target="_blank">${text}</a>`;
                
                contentArea.appendChild(wrapper);
                refreshItems();
            }
        }

        function changeBgColor() {
            let color = prompt("Háttérszín (pl. #ffffff, #f4f4f4, lightgray):");
            if (color) {
                document.body.style.backgroundColor = color;
            }
        }

        function saveAndExit() {
            adminModeOn = false;
            document.body.classList.remove('admin-active');
            document.getElementById('admin-toolbar').style.display = 'none';

            if (sortableInstance) {
                sortableInstance.destroy();
            }

            // Szerkeszthetőség kikapcsolása
            const textElements = contentArea.querySelectorAll('h1, h2, p, a');
            textElements.forEach(el => el.contentEditable = "false");

            db.ref('oldalAdatok').set({
                html: contentArea.innerHTML,
                bgColor: document.body.style.backgroundColor
            });

            alert("Minden módosítás elmentve!");
        }
    </script>

</body>
</html>
