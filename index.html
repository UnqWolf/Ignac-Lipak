<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignác oldala</title>
    <!-- Firebase SDK betöltése -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Times New Roman", Times, serif;
            margin: 40px;
            line-height: 1.6;
        }
        h1 {
            color: #0000cc;
            border-bottom: 1px solid #cccccc;
            padding-bottom: 5px;
        }
        /* Diszkrét, négyzet alakú gomb a jobb alsó sarokban */
        .admin-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            background: #ff3333;
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .editable-active {
            outline: 2px dashed #ff3333;
            background-color: rgba(255, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <!-- A főoldal tartalma -->
    <div id="szerkesztheto-tartalom">
        <h1 contenteditable="false" id="cim">Üdvözöllek a weboldalamon!</h1>
        <p contenteditable="false" id="szoveg">Szia! Én vagyok Ignác.</p>
    </div>

    <!-- Jobb alsó sarok admin gomb -->
    <button class="admin-btn" onclick="toggleAdminMode()" id="adminGomb" title="Admin">⚙️</button>

    <script>
        // 1. Firebase konfiguráció
        const firebaseConfig = {
            databaseURL: "https://vercel-custom-il-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const cimElem = document.getElementById('cim');
        const szovegElem = document.getElementById('szoveg');

        // 2. Adatok automatikus betöltése az oldal megnyitásakor
        db.ref('oldalAdatok').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.cim) cimElem.innerText = data.cim;
                if (data.szoveg) szovegElem.innerText = data.szoveg;
            }
        });

        let adminModeOn = false;

        function toggleAdminMode() {
            adminModeOn = !adminModeOn;
            const gomb = document.getElementById('adminGomb');

            if (adminModeOn) {
                gomb.innerText = "💾";
                gomb.style.background = "#33cc33";
                
                cimElem.contentEditable = "true";
                szovegElem.contentEditable = "true";
                
                cimElem.classList.add('editable-active');
                szovegElem.classList.add('editable-active');
            } else {
                gomb.innerText = "⚙️";
                gomb.style.background = "#ff3333";
                
                cimElem.contentEditable = "false";
                szovegElem.contentEditable = "false";
                
                cimElem.classList.remove('editable-active');
                szovegElem.classList.remove('editable-active');

                // Adatok csendes mentése a Firebase-be
                db.ref('oldalAdatok').set({
                    cim: cimElem.innerText,
                    szoveg: szovegElem.innerText
                });
            }
        }
    </script>

</body>
</html>
